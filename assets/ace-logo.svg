<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#122240;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00CC33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CC33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer circle shadow -->
  <circle cx="150" cy="150" r="140" fill="#060D17" opacity="0.5" transform="translate(4, 4)"/>

  <!-- Main background circle -->
  <circle cx="150" cy="150" r="140" fill="url(#bgGrad)" stroke="#0F1D32" stroke-width="2"/>

  <!-- Outer decorative ring -->
  <circle cx="150" cy="150" r="136" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.8"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>

  <!-- Inner decorative ring -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="#00FF41" stroke-width="0.5" opacity="0.2"/>

  <!-- Curved text - AVIATION CAREER ENRICHMENT -->
  <path id="topArc" d="M 50,150 a 100,100 0 0,1 200,0" fill="none"/>
  <text font-family="'Rajdhani', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#8899B3" letter-spacing="3.5" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">AVIATION CAREER ENRICHMENT</textPath>
  </text>

  <!-- Bottom curved text - INC. -->
  <path id="bottomArc" d="M 60,160 a 95,95 0 0,0 180,0" fill="none"/>
  <text font-family="'Rajdhani', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#8899B3" letter-spacing="6" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">EST. ATLANTA, GA</textPath>
  </text>

  <!-- Globe/arc lines behind airplane -->
  <ellipse cx="150" cy="185" rx="70" ry="20" fill="none" stroke="url(#arcGrad)" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="150" cy="185" rx="50" ry="14" fill="none" stroke="url(#arcGrad)" stroke-width="1" opacity="0.3"/>
  <ellipse cx="150" cy="185" rx="90" ry="26" fill="none" stroke="url(#arcGrad)" stroke-width="1" opacity="0.2"/>

  <!-- Airplane silhouette - sleek jet -->
  <g transform="translate(150, 145) scale(1.1)" filter="url(#glow)">
    <!-- Fuselage -->
    <path d="M -45,0 C -40,-3 -20,-5 0,-5 C 15,-5 30,-4 45,-2 L 50,0 L 45,2 C 30,4 15,5 0,5 C -20,5 -40,3 -45,0 Z" fill="url(#planeGrad)"/>
    <!-- Wings -->
    <path d="M -5,-5 L -20,-28 L -15,-28 L 10,-5 Z" fill="url(#planeGrad)"/>
    <path d="M -5,5 L -20,28 L -15,28 L 10,5 Z" fill="url(#planeGrad)"/>
    <!-- Tail -->
    <path d="M -40,-2 L -50,-16 L -42,-16 L -35,-2 Z" fill="url(#planeGrad)"/>
    <path d="M -40,2 L -50,16 L -42,16 L -35,2 Z" fill="url(#planeGrad)"/>
    <!-- Tail fin -->
    <path d="M -42,0 L -52,-12 L -46,-12 L -38,0 Z" fill="url(#planeGrad)" opacity="0.7"/>
    <!-- Engine glow trail -->
    <ellipse cx="-48" cy="0" rx="5" ry="2" fill="#00FF41" opacity="0.4" filter="url(#softGlow)"/>
  </g>

  <!-- ACE text - main title -->
  <text x="150" y="118" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#00FF41" text-anchor="middle" letter-spacing="12" filter="url(#glow)">ACE</text>

  <!-- Small stars/dots decorating the badge -->
  <circle cx="65" cy="150" r="2" fill="#00FF41" opacity="0.6"/>
  <circle cx="235" cy="150" r="2" fill="#00FF41" opacity="0.6"/>
  <circle cx="150" cy="45" r="1.5" fill="#00FF41" opacity="0.4"/>
  <circle cx="150" cy="255" r="1.5" fill="#00FF41" opacity="0.4"/>

  <!-- Wing accent lines -->
  <line x1="80" y1="150" x2="55" y2="150" stroke="#00FF41" stroke-width="1.5" opacity="0.4"/>
  <line x1="220" y1="150" x2="245" y2="150" stroke="#00FF41" stroke-width="1.5" opacity="0.4"/>
</svg>
